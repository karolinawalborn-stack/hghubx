name: HGhubX Windows and Android installers
on:
  push:
    branches: [codex-build/hghubx-1.3.0-20261124]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 4
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis -- --locked
      - name: Verify and stage x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -File)
          if ($source.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          New-Item -ItemType Directory artifacts | Out-Null
          $installer = "artifacts/HGhubX_1.3.0_Windows_x64_Setup.exe"
          Copy-Item -LiteralPath $source[0].FullName -Destination $installer
          $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($installer))
          try { if ($reader.ReadUInt16() -ne 0x5A4D) { throw "Invalid executable header" } } finally { $reader.Dispose() }
          Copy-Item -LiteralPath LICENSE -Destination artifacts/LICENSE.txt
          (Get-FileHash -LiteralPath $installer).Hash.ToLowerInvariant() + "  " + (Split-Path -Leaf $installer) | Set-Content artifacts/SHA256-windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci
      - run: pnpm tauri android build --ci --apk --split-per-abi --target aarch64 -- --locked
      - name: Sign and verify standalone ARM64 APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name "*-release*.apk" -type f)
          [[ ${#apks[@]} -eq 1 ]]
          mkdir artifacts
          ks="$RUNNER_TEMP/hghubx-test.p12"
          pass=$(openssl rand -hex 24)
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias hghubx-test -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=HGhubX Personal Build"
          tooling="$ANDROID_HOME/build-tools/36.0.0"
          apk=HGhubX_1.3.0_Android_ARM64.apk
          "$tooling/apksigner" sign --ks "$ks" --ks-key-alias hghubx-test --ks-pass "pass:$pass" --v4-signing-enabled false --out "artifacts/$apk" "${apks[0]}"
          rm -f "$ks"
          "$tooling/apksigner" verify --verbose --print-certs "artifacts/$apk"
          "$tooling/aapt2" dump badging "artifacts/$apk" > "$RUNNER_TEMP/hghubx-badging.txt"
          grep -F "name='com.hghubx.app'" "$RUNNER_TEMP/hghubx-badging.txt"
          grep -F "versionName='1.3.0'" "$RUNNER_TEMP/hghubx-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/hghubx-badging.txt"
          cp LICENSE artifacts/LICENSE.txt
          (cd artifacts && sha256sum "$apk" > SHA256-android.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-installer
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
